name: Build JAR
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      - name: Unzip and build
        run: |
          mkdir work
          unzip -q "PvP pack.zip" -d work
          cd "$(dirname "$(find work -name build.gradle | head -n1)")"
          gradle build --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/libs/*.jar "$GITHUB_WORKSPACE/out/"
      - uses: actions/upload-artifact@v4
        with:
          name: pvp-pack-manager-jar
          path: |
            out/*.jar
            !out/*-sources.jar
